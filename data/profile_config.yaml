# Central config for the whoami card (assets/whoami-card.svg).
# Edit this file and re-run `python scripts/make_whoami_card.py` to regenerate
# the card -- you never need to touch the SVG-building code.

username: lucasschn1

os: "Windows, Linux"
host: ""                             # employer / where you work (blank = line omitted)
title: "Full Stack Developer"       # job title -> shown as "Kernel"
ide: "IntelliJ IDEA, VS Code"

languages_programming:
  - JavaScript
  - PHP
  - Python
  - Java

# markup / config / query languages -> shown as "Languages.Computer"
languages_computer:
  - HTML
  - CSS
  - SQL
  - JSON
  - YAML

languages_spoken:
  - Portuguese
  - English

hobbies_tech:

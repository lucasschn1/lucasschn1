name: Update profile art

"on":
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily (well clear of the metrics job)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "data/profile_config.yaml"
      - "data/ascii_source.txt"
      - "scripts/**"

permissions:
  contents: write

jobs:
  profile-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r scripts/requirements.txt

      - name: Fetch contributions (no token)
        run: python scripts/fetch_contributions.py

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Render whoami card SVG (portrait + info)
        run: python scripts/make_whoami_card.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: >-
            data/contributions.json
            assets/contrib-heatmap.svg
            assets/whoami-card.svg

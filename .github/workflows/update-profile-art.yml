name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily (~03:17 America/Sao_Paulo)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "data/profile_config.yaml"
      - "data/ascii_source.txt"
      - "scripts/**"

permissions:
  contents: write

jobs:
  profile-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r scripts/requirements.txt

      - name: Fetch contributions (no token)
        run: python scripts/fetch_contributions.py

      - name: Fetch public GitHub stats (no token)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github_stats.py

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Render whoami card SVG (portrait + info, static)
        run: python scripts/make_whoami_card.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: >-
            data/contributions.json
            data/github_stats.json
            assets/contrib-heatmap.svg
            assets/whoami-card.svg

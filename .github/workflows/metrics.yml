name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    # weekly -- language/line stats barely move day to day, and this keeps the
    # bot commits (and any race with "Update profile art") to a minimum.
    - cron: "0 5 * * 1"

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lucasschn1
          filename: assets/metrics.svg
          base: header, activity, community, repositories, metadata
          
          # Linguagens
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          
          # REMOVER HTML E OUTRAS LINGUAGENS DE MARKUP
          plugin_languages_ignored: HTML, CSS, Markdown, YAML, JSON, XML
          
          # Linhas de código
          plugin_lines: yes
          
          # Template
          template: classic
          
          # Theme -- self-contained dark card, matched to the whoami/heatmap palette
          extras_css: |
            :root {
              --color-primary: #39d353;
              --color-secondary: #2ea043;
              --color-text: #c9d1d9;
              --color-background: #0d1117;
              --color-calendar-graph-day-bg: #161b22;
            }
            .field { border-color: #30363d !important; }
